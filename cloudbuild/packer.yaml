# Every step image is pinned to an exact tag and its digest: a floating tag (":slim", "alpine")
# changes under the build without a commit. To upgrade, change the tag and the digest together in a PR.
steps:
  # Download a pinned Packer version, check it against the pinned SHA256 and unzip it to /workspace,
  # which every step of the build shares. Done in Alpine, whose busybox has wget, sha256sum and unzip:
  # the gcloud image dropped python3, which this step used to unzip with (2026-11-09).
  # Packer runs in the gcloud image in the next steps: it needs gcloud on the same machine to open the
  # IAP tunnel to the build VM (use_iap), and the official Packer image does not include it. The
  # Packer binary is statically linked, so it runs in both images.
  - id: 'install-packer'
    name: 'alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        mkdir -p /workspace/bin
        wget -q -O /tmp/packer.zip https://releases.hashicorp.com/packer/$_PACKER_VERSION/packer_${_PACKER_VERSION}_linux_amd64.zip
        echo "$_PACKER_SHA256  /tmp/packer.zip" | sha256sum -c -
        unzip -o /tmp/packer.zip -d /workspace/bin
        chmod +x /workspace/bin/packer
        /workspace/bin/packer version

  # Initialize Packer plugins (downloads the googlecompute plugin)
  - id: 'packer-init'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:592.0.0-slim@sha256:08c9cb2c82625689f26172f46f2cefdf30c3449959a71492569a824b537d369f'
    entrypoint: '/workspace/bin/packer'
    args: ['init', 'packer/']
    env:
      - 'PACKER_PLUGIN_PATH=/workspace/.packer/plugins'
      - 'CHECKPOINT_DISABLE=1'

  # Validate Packer configuration before building
  - id: 'packer-validate'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:592.0.0-slim@sha256:08c9cb2c82625689f26172f46f2cefdf30c3449959a71492569a824b537d369f'
    entrypoint: '/workspace/bin/packer'
    args:
      - 'validate'
      - '-var'
      - 'project_id=$_PROJECT_ID'
      - '-var'
      - 'zone=$_ZONE'
      - '-var'
      - 'environment=$_ENVIRONMENT'
      - '-var'
      - 'use_iap=$_USE_IAP'
      - 'packer/'
    env:
      - 'PACKER_PLUGIN_PATH=/workspace/.packer/plugins'
      - 'CHECKPOINT_DISABLE=1'

  # Build the golden image — creates a temporary VM, runs install.sh, snapshots the disk
  # PACKER_LOG=1 streams provisioner output to Cloud Build logs
  - id: 'packer-build'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:592.0.0-slim@sha256:08c9cb2c82625689f26172f46f2cefdf30c3449959a71492569a824b537d369f'
    entrypoint: '/workspace/bin/packer'
    args:
      - 'build'
      - '-var'
      - 'project_id=$_PROJECT_ID'
      - '-var'
      - 'zone=$_ZONE'
      - '-var'
      - 'environment=$_ENVIRONMENT'
      - '-var'
      - 'use_iap=$_USE_IAP'
      - 'packer/'
    env:
      - 'PACKER_LOG=1'
      - 'PACKER_PLUGIN_PATH=/workspace/.packer/plugins'
      - 'CHECKPOINT_DISABLE=1'

substitutions:
  _PROJECT_ID: 'your-gcp-project-id'
  _ZONE: 'europe-west1-b'
  # Selects the build subnet (packer/variables.pkr.hcl)
  _ENVIRONMENT: 'prod'
  # true  — build VM in the build subnet, without external IP, SSH through an IAP tunnel
  # false — default network and the VM's external IP; only for the first build
  _USE_IAP: 'true'
  # To upgrade Packer change both values. The checksum is in
  # https://releases.hashicorp.com/packer/<version>/packer_<version>_SHA256SUMS (linux_amd64 line)
  _PACKER_VERSION: '1.16.1'
  _PACKER_SHA256: 'af38a9e93e4ed1b9ca68206ae969c64c300c82a3dde46a780dfa629f0867f651'

# Packer builds take about 8 minutes (8 min 18 s measured on 2026-11-11), depending on apt-get and WordPress download speed
timeout: '3600s'

options:
  logging: CLOUD_LOGGING_ONLY
