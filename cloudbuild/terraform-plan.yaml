steps:
  # Verify Terraform version
  - id: "verify-terraform-version"
    name: "hashicorp/terraform:1.15.7"
    args: ["version"]

  # Create tmp directory required by archive_file data source (Cloud Function zip)
  - id: "create-tmp"
    name: "alpine"
    dir: "terraform"
    entrypoint: "sh"
    args: ["-c", "mkdir -p tmp"]

  # Initialize Terraform
  - id: "terraform-init"
    name: "hashicorp/terraform:1.15.7"
    dir: "terraform"
    args:
      - "init"
      - "-input=false"
      - "-no-color"
      - "-backend-config=bucket=$_PROJECT_ID-wordpress-terraform-state"

  # Check Terraform formatting
  - id: "terraform-fmt-check"
    name: "hashicorp/terraform:1.15.7"
    dir: "terraform"
    args:
      - "fmt"
      - "-check"
      - "-recursive"
      - "-no-color"

  # Validate Terraform configuration
  - id: "terraform-validate"
    name: "hashicorp/terraform:1.15.7"
    dir: "terraform"
    args:
      - "validate"
      - "-no-color"

  # Generate Terraform plan
  - id: "terraform-plan"
    name: "hashicorp/terraform:1.15.7"
    dir: "terraform"
    args:
      - "plan"
      - "-out=tfplan"
      - "-input=false"
      - "-no-color"
    env:
      - "TF_VAR_project_id=$_PROJECT_ID"

  # Convert Terraform plan to text and JSON format for easier analysis and artifact storage
  - id: "plan-to-text"
    name: "hashicorp/terraform:1.15.7"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        terraform show -no-color tfplan > plan.txt
        terraform show -json tfplan > plan.json
        echo 'Plan saved to terraform/plan.txt and terraform/plan.json'

  # List destructive changes in the plan. Report only: this step never fails the build.
  # The apply pipeline runs the same script in enforce mode. See scripts/check_destructive.py for details.
  - id: "report-destructive-changes"
    name: "python:3.12-alpine"
    entrypoint: "python"
    args:
      - "/workspace/cloudbuild/scripts/check_destructive.py"
    env:
      - "CHECK_MODE=report"

  # Upload the plan artifacts so the apply pipeline can use them.
  # Skipped when _SAVE_PLAN is not "true": pull request plans are for review only and cannot be applied.
  - id: "upload-plan-artifacts"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        if [ "$_SAVE_PLAN" != "true" ]; then
          echo "_SAVE_PLAN is not 'true'. Review-only plan, nothing uploaded."
          exit 0
        fi
        gcloud storage cp plan.txt gs://$_STATE_BUCKET/plans/${BUILD_ID}/plan.txt
        gcloud storage cp tfplan gs://$_STATE_BUCKET/plans/${BUILD_ID}/tfplan
        gcloud storage cp tmp/db_backup.zip gs://$_STATE_BUCKET/plans/${BUILD_ID}/db_backup.zip
        echo "Plan artifacts uploaded to gs://$_STATE_BUCKET/plans/${BUILD_ID}/"

substitutions:
  _PROJECT_ID: "your-gcp-project-id"
  _STATE_BUCKET: "your-state-bucket-name"
  _SAVE_PLAN: "false"

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
