# Every step image is pinned to an exact tag and its digest: a floating tag (":slim", "alpine")
# changes under the build without a commit. To upgrade, change the tag and the digest together in a PR.
steps:
  # Verify Terraform version
  - id: "verify-terraform-version"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    args: ["version"]

  # Create tmp directory required by archive_file data source (Cloud Function zip)
  - id: "create-tmp"
    name: "alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a"
    dir: "terraform"
    entrypoint: "sh"
    args: ["-c", "mkdir -p tmp"]

  # Initialize Terraform
  - id: "terraform-init"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    dir: "terraform"
    args:
      - "init"
      - "-input=false"
      - "-no-color"
      - "-backend-config=bucket=$_STATE_BUCKET"

  # Check Terraform formatting
  - id: "terraform-fmt-check"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    dir: "terraform"
    args:
      - "fmt"
      - "-check"
      - "-recursive"
      - "-no-color"

  # Validate Terraform configuration
  - id: "terraform-validate"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    dir: "terraform"
    args:
      - "validate"
      - "-no-color"

  # Generate Terraform plan
  - id: "terraform-plan"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    dir: "terraform"
    args:
      - "plan"
      - "-out=tfplan"
      - "-input=false"
      - "-no-color"
    env:
      - "TF_VAR_project_id=$_PROJECT_ID"
      - "TF_VAR_iap_user_email=$_IAP_USER_EMAIL"
      - "TF_VAR_domain_names=$_DOMAIN_NAMES"

  # Convert Terraform plan to text and JSON format for easier analysis and artifact storage
  - id: "plan-to-text"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        terraform show -no-color tfplan > plan.txt
        terraform show -json tfplan > plan.json
        echo 'Plan saved to terraform/plan.txt and terraform/plan.json'

  # List destructive changes in the plan. Report only: this step never fails the build.
  # The apply pipeline runs the same script in enforce mode. See scripts/check_destructive.py for details.
  - id: "report-destructive-changes"
    name: "python:3.12.15-alpine3.24@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d"
    entrypoint: "python"
    args:
      - "/workspace/cloudbuild/scripts/check_destructive.py"
    env:
      - "CHECK_MODE=report"

  # Upload the plan artifacts so the apply pipeline can use them.
  # Skipped when _SAVE_PLAN is not "true": pull request plans are for review only and cannot be applied.
  - id: "upload-plan-artifacts"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:592.0.0-slim@sha256:08c9cb2c82625689f26172f46f2cefdf30c3449959a71492569a824b537d369f"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        if [ "$_SAVE_PLAN" != "true" ]; then
          echo "_SAVE_PLAN is not 'true'. Review-only plan, nothing uploaded."
          exit 0
        fi
        gcloud storage cp plan.txt gs://$_STATE_BUCKET/plans/${BUILD_ID}/plan.txt
        gcloud storage cp tfplan gs://$_STATE_BUCKET/plans/${BUILD_ID}/tfplan
        gcloud storage cp tmp/db_backup.zip gs://$_STATE_BUCKET/plans/${BUILD_ID}/db_backup.zip
        echo "Plan artifacts uploaded to gs://$_STATE_BUCKET/plans/${BUILD_ID}/"

substitutions:
  _PROJECT_ID: "your-gcp-project-id"
  _STATE_BUCKET: "your-state-bucket-name"
  _IAP_USER_EMAIL: "your-email-address"
  # Comma separated (example.com,www.example.com). The placeholder fails the variable validation.
  _DOMAIN_NAMES: "your-domain-names"
  _SAVE_PLAN: "false"

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
