# Every step image is pinned to an exact tag and its digest: a floating tag (":slim", "alpine")
# changes under the build without a commit. To upgrade, change the tag and the digest together in a PR.
steps:
  # Ensure _PLAN_BUILD_ID is set before proceeding.
  - id: "check-plan-build-id"
    name: "alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        if [ -z "$_PLAN_BUILD_ID" ]; then
          echo "Error: _PLAN_BUILD_ID is not set. This build must be triggered with a valid plan build ID."
          exit 1
        fi
        echo "Using Terraform plan from build: $_PLAN_BUILD_ID"

  # Create tmp directory required by archive_file data source (Cloud Function zip)
  - id: "create-tmp"
    name: "alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a"
    dir: "terraform"
    entrypoint: "sh"
    args: ["-c", "mkdir -p tmp"]

  # Initialize Terraform
  - id: "terraform-init"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    dir: "terraform"
    args:
      - "init"
      - "-input=false"
      - "-no-color"
      - "-backend-config=bucket=$_STATE_BUCKET"

  # Download the tfplan generated by the plan pipeline.
  - id: "download-plan-artifacts"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:592.0.0-slim@sha256:08c9cb2c82625689f26172f46f2cefdf30c3449959a71492569a824b537d369f"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        gcloud storage cp gs://$_STATE_BUCKET/plans/$_PLAN_BUILD_ID/tfplan tfplan
        gcloud storage cp gs://$_STATE_BUCKET/plans/$_PLAN_BUILD_ID/db_backup.zip tmp/db_backup.zip
        echo "Plan artifacts downloaded from gs://$_STATE_BUCKET/plans/$_PLAN_BUILD_ID/"

  # Convert the downloaded plan to JSON so the destructive change check reads exactly what will be applied.
  - id: "plan-to-json"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        terraform show -json tfplan > plan.json

  # Block the apply if the plan destroys or replaces resources and _ALLOW_DESTRUCTIVE is not "true".
  # Protected resources (Cloud SQL instance and database, backup and uploads buckets) are blocked regardless of the flag.
  # See scripts/check_destructive.py for details.
  - id: "enforce-destructive-changes"
    name: "python:3.12.15-alpine3.24@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d"
    entrypoint: "python"
    args:
      - "/workspace/cloudbuild/scripts/check_destructive.py"
    env:
      - "CHECK_MODE=enforce"
      - "ALLOW_DESTRUCTIVE=$_ALLOW_DESTRUCTIVE"

  # Apply the previously generated plan.
  - id: "terraform-apply"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    dir: "terraform"
    args:
      - "apply"
      - "-input=false"
      - "-no-color"
      - "tfplan"
    env:
      - "TF_VAR_project_id=$_PROJECT_ID"

  # Show outputs after apply.
  - id: "terraform-output"
    name: "hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae"
    dir: "terraform"
    args:
      - "output"
      - "-no-color"

substitutions:
  _PROJECT_ID: "your-gcp-project-id"
  _STATE_BUCKET: "your-state-bucket-name"
  _PLAN_BUILD_ID: "approved-plan-build-id"
  _ALLOW_DESTRUCTIVE: "false"

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
